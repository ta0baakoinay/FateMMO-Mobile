# ============================================================================
#  Fate MMO Android client — SINGLE SOURCE OF TRUTH for server configuration
# ============================================================================
#  Edit these values, then rebuild the APK:
#      cd AndroidClient/webview-app
#      ..\..\gradlew.bat :app:assembleDebug        (or use C:\Gradle\gradle-8.9\bin\gradle)
#
#  Every value below is injected at build time into:
#    * BuildConfig (MainActivity)
#    * assets/web/Config.local.js  (roBrowser ROConfigLocal overrides)
#  Nothing server-specific is hard-coded anywhere else in the project.
# ----------------------------------------------------------------------------

# PUBLIC address the client talks to = the PROXY host (main IP 51.79.147.208
# is never exposed). rAthena's subnet_athena.conf already advertises this IP.
CLIENT_SERVER_ADDRESS=167.104.101.102

# Login-server port as reachable THROUGH the proxy. The mobile rAthena instance
# listens on 7900/7121/7122 (login/char/map) so it never collides with the live
# 20250716 server on 6900/6121/5121. The proxy forwards 7900/7121/7122 -> main.
CLIENT_LOGIN_PORT=7900

# wsProxy (WebSocket<->TCP) — runs on the PROXY host. ws:// for bare-IP testing,
# wss:// once a TLS domain fronts it.
CLIENT_WSPROXY_URL=ws://167.104.101.102:5999/

# Remote Client (GRF asset HTTP server) — runs on the PROXY host (needs the GRF
# files, no rAthena link). Trailing slash required.
CLIENT_REMOTE_CLIENT_URL=http://167.104.101.102:8000/

# Packet version. MUST equal the packetver of the rAthena instance this client
# connects to. roBrowserLegacy has packet tables only up to ~2021-2022, so it
# CANNOT talk to your PACKETVER 20250716 main server. Point this client at a
# SECOND rAthena instance built at 20180620 (see server-bundle/README §1).
CLIENT_PACKETVER=20180620

# Renewal mechanics — MUST match the server's src/config/renewal.hpp.
# The supplied server source has `#define PRERE` ACTIVE -> pre-renewal -> false.
CLIENT_RENEWAL=false

# Client charset / codepage (roBrowser langtype). 1 = default.
CLIENT_LANGTYPE=1

# Cosmetic only.
CLIENT_DISPLAY_NAME=Fate MMO

# Android app identity.
APP_ID=com.fatemmo.client
APP_VERSION_NAME=0.1.9
APP_VERSION_CODE=10

